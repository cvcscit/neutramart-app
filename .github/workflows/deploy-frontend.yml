name: Deploy frontend to CloudFront

on:
  push:
    branches: [feature/w360-full]
    paths:
      - "maitribot/client/**"

permissions:
  id-token: write   # required to mint the OIDC token for AssumeRoleWithWebIdentity
  contents: read

env:
  AWS_REGION: ap-south-1
  BUCKET: w360-maitribot-ui
  DISTRIBUTION_ID: E1H343JO0UX83F

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maitribot/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::792207721590:role/github-actions-nutrasmart-frontend-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and deploy
        run: ./deploy.sh
